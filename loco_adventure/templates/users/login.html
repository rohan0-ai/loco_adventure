<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocoAdventure - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-input {
            transition: all 0.3s ease;
        }

        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-600 to-blue-500 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white/10 backdrop-blur-md fixed w-full z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Logo -->
            <div class="text-white font-bold text-xl sm:text-2xl flex items-center space-x-2">
                <svg class="w-8 h-8 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <a href="{% url 'home' %}" class="hover:underline">LocoAdventure</a>
            </div>

            <div class="space-x-4">
                <a href="{% url 'user-register' %}" class="text-white hover:text-yellow-300">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container mx-auto px-6 pt-24 pb-12 flex items-center justify-center">
        <div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-xl p-8 shadow-xl">
            <h2 class="text-3xl font-bold text-white mb-8 text-center">Welcome Back Adventurer!</h2>

            <form method="post" action="{% url 'user-login' %}" class="space-y-6">
                {% csrf_token %}
                {% if messages %}
                <div class="mb-4">
                    {% for message in messages %}
                    <p class="text-red-500">{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                <div>
                    <label for="username" class="block text-white text-sm font-medium mb-2">📧 Username</label>
                    <input type="text" id="username" name="username" required
                        class="form-input w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-white/50 focus:bg-white/30"
                        placeholder="Enter your username" />
                </div>

                <div>
                    <label for="password" class="block text-white text-sm font-medium mb-2">🔒 Password</label>
                    <input type="password" id="password" name="password" required
                        class="form-input w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-white/50 focus:bg-white/30"
                        placeholder="••••••••" />
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-yellow-400 to-orange-400 text-purple-900 px-6 py-3 rounded-lg font-bold hover:shadow-lg transition-all transform hover:scale-105">
                    🚀 Login
                </button>

                <p class="text-center text-white text-sm">
                    New adventurer?
                    <a href="{% url 'user-register' %}" class="text-yellow-300 hover:text-yellow-400 font-medium">Create
                        account</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center text-white/80 text-sm pb-6">
        <p>© 2025 LocoAdventure. All rights reserved.</p>
    </div>
</body>

</html>
