{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocoAdventure - Vendor Login</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="bg-gradient-to-br from-green-600 to-blue-500 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white/20 backdrop-blur-lg rounded-xl p-8 shadow-xl">
        <h2 class="text-3xl font-bold text-white mb-8 text-center">Vendor Login</h2>
        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <p class="text-red-500">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        <form method="post" action="{% url 'vendors:vendor-login' %}" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-white text-sm font-medium mb-2" for="username">Username</label>
                <input id="username" name="username" type="text" required
                    class="form-input w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-white/50 focus:bg-white/30" />
            </div>
            <div>
                <label class="block text-white text-sm font-medium mb-2" for="password">Password</label>
                <input id="password" name="password" type="password" required
                    class="form-input w-full px-4 py-3 rounded-lg bg-white/20 border border-white/30 text-white placeholder-white/50 focus:bg-white/30" />
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-yellow-400 to-orange-400 text-green-900 px-6 py-3 rounded-lg font-bold hover:shadow-lg transition-all transform hover:scale-105">
                Login
            </button>
        </form>
        <p class="text-center text-white text-sm mt-4">
            Don't have an account?
            <a href="{% url 'vendors:vendor-register' %}"
                class="text-yellow-300 hover:text-yellow-400 font-medium">Register
                here</a>
        </p>
    </div>
</body>

</html>
